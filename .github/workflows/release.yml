name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      first_release_run_id:
        description: Run ID that built the first npm release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created || steps.recover.outputs.ready }}
      tag: ${{ steps.release.outputs.tag_name || steps.recover.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.recover.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Update the release PR or tag a merged release
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        with:
          release-type: node

      - name: Identify the previously built first release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.first_release_run_id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v0.1.0" --jq .sha)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          jq -e --arg sha "$tag_sha" '
            .head_sha == $sha and .event == "push" and .head_branch == "main" and
            .path == ".github/workflows/release.yml" and .status == "completed"
          ' <<< "$run" >/dev/null
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'tag=v0.1.0' >> "$GITHUB_OUTPUT"
          echo 'version=0.1.0' >> "$GITHUB_OUTPUT"

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the tagged release commit
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify the package and lockfile versions
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const { version } = require('./package.json');
          const lock = require('./package-lock.json');
          if (version !== process.env.RELEASE_VERSION ||
              lock.version !== version || lock.packages[''].version !== version) {
            throw Error('The release, package and lockfile versions must match.');
          }
          NODE

      - name: Install dependencies
        if: github.event_name == 'push'
        run: npm ci

      - name: Build the npm package
        if: github.event_name == 'push'
        run: |
          mkdir -p release
          npm pack --pack-destination release

      - name: Recover the existing first-release package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.first_release_run_id }}

      - name: Check the npm package
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          archive="release/aidea-labs-aidea-zotero-mcp-$RELEASE_VERSION.tgz"
          tar -tzf "$archive" > package-files.txt
          grep -Fxq 'package/dist/index.js' package-files.txt
          grep -Fxq 'package/dist/mcp/prompts.js' package-files.txt
          grep -Fxq 'package/dist/ui/prototype.html' package-files.txt
          grep -Fxq 'package/dist/ui/prototype.js' package-files.txt
          grep -Fxq 'package/dist/ui/prompt-host.js' package-files.txt

      - name: Upload the npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.version != '0.1.0'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the built npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Publish to npm
        run: npm publish ./release/*.tgz --access public

  bootstrap-stage:
    needs: [release-please, build]
    if: needs.release-please.outputs.version == '0.1.0'
    runs-on: ubuntu-latest
    environment: npm-bootstrap
    steps:
      - name: Set up Node.js for staged publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the built npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Install the npm CLI with staged-publishing support
        run: npm install --global npm@11.15.0

      - name: Stage the first version for approval on npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm stage publish ./release/*.tgz --access public

  bootstrap-confirm:
    needs: [release-please, bootstrap-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Node.js to verify registry metadata
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download the staged package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Wait for npm approval and verify the public package
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';

          const version = process.env.RELEASE_VERSION;
          const archive = readFileSync('release/aidea-labs-aidea-zotero-mcp-' + version + '.tgz');
          const expected = 'sha512-' + createHash('sha512').update(archive).digest('base64');
          const url = 'https://registry.npmjs.org/@aidea-labs%2Faidea-zotero-mcp/' + version;
          console.log('Approve this version in npmjs.com → Staged Packages.');

          for (let attempt = 0; attempt < 50; attempt++) {
            const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(8000) })
              .catch(() => undefined);
            if (response?.ok) {
              const { dist } = await response.json();
              if (dist?.integrity !== expected) throw Error('The public package differs from the staged archive.');
              console.log('The approved npm package matches the staged archive.');
              process.exit(0);
            }
            if (response && response.status !== 404 && response.status !== 429 && response.status < 500) {
              throw Error('Unexpected registry response: ' + response.status);
            }
            await setTimeout(25000);
          }
          throw Error('Approval is still pending. Approve the package on npmjs.com, then rerun failed jobs.');
          NODE

  upload-release-asset:
    needs: [release-please, build, publish, bootstrap-confirm]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.bootstrap-confirm.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the published package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Attach the published package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
