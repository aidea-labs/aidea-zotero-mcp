name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      first_version:
        description: Exact package version to stage for the first publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve the release version
        id: version
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          FIRST_VERSION: ${{ inputs.first_version }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const { version } = require('./package.json');
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            if (!stable.test(version) || process.env.FIRST_VERSION !== version) {
              throw Error('Enter the exact stable version from package.json.');
            }
          } else {
            const previousSha = process.env.PREVIOUS_SHA;
            if (!previousSha || /^0+$/.test(previousSha)) process.exit(0);
            const previous = JSON.parse(execFileSync('git', ['show', previousSha + ':package.json'], {
              encoding: 'utf8',
            })).version;
            if (previous === version) process.exit(0);
            if (!stable.test(previous) || !stable.test(version)) throw Error('Expected stable x.y.z versions.');
            const old = previous.split('.').map(BigInt);
            const current = version.split('.').map(BigInt);
            const changed = current.findIndex((part, index) => part !== old[index]);
            if (current[changed] <= old[changed]) throw Error('The package version must increase.');
          }

          const lock = require('./package-lock.json');
          if (lock.version !== version || lock.packages[''].version !== version) {
            throw Error('Update package-lock.json along with package.json.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'tag=v' + version + '\n');
          NODE

      - name: Install dependencies
        if: steps.version.outputs.tag != ''
        run: npm ci

      - name: Build and check the npm package
        if: steps.version.outputs.tag != ''
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          npm pack --pack-destination release
          archive="release/aidea-labs-aidea-zotero-mcp-$version.tgz"
          tar -tzf "$archive" > package-files.txt
          grep -Fxq 'package/dist/index.js' package-files.txt
          grep -Fxq 'package/dist/mcp/prompts.js' package-files.txt
          grep -Fxq 'package/dist/ui/prototype.html' package-files.txt
          grep -Fxq 'package/dist/ui/prototype.js' package-files.txt
          grep -Fxq 'package/dist/ui/prompt-host.js' package-files.txt

      - name: Upload the npm package
        if: steps.version.outputs.tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the built npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Publish to npm
        run: npm publish release/*.tgz --access public

  bootstrap-stage:
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: npm-bootstrap
    steps:
      - name: Verify the package has no public release
        run: |
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            'https://registry.npmjs.org/@aidea-labs%2Faidea-zotero-mcp')
          test "$status" = 404

      - name: Set up Node.js for staged publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the built npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Stage the first version for approval on npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm stage publish release/*.tgz --access public

  bootstrap-confirm:
    needs: [build, bootstrap-stage]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Node.js to verify registry metadata
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download the staged package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Wait for npm approval and verify the public package
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';

          const version = process.env.RELEASE_TAG.slice(1);
          const archive = readFileSync('release/aidea-labs-aidea-zotero-mcp-' + version + '.tgz');
          const expected = 'sha512-' + createHash('sha512').update(archive).digest('base64');
          const url = 'https://registry.npmjs.org/@aidea-labs%2Faidea-zotero-mcp/' + version;
          console.log('Approve this version in npmjs.com → Staged Packages.');

          for (let attempt = 0; attempt < 50; attempt++) {
            const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(8000) })
              .catch(() => undefined);
            if (response?.ok) {
              const { dist } = await response.json();
              if (dist?.integrity !== expected) throw Error('The public package differs from the staged archive.');
              console.log('The approved npm package matches the staged archive.');
              process.exit(0);
            }
            if (response && response.status !== 404 && response.status !== 429 && response.status < 500) {
              throw Error('Unexpected registry response: ' + response.status);
            }
            await setTimeout(25000);
          }
          throw Error('Approval is still pending. Approve the package on npmjs.com, then rerun failed jobs.');
          NODE

  github-release:
    needs: [build, publish, bootstrap-confirm]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.bootstrap-confirm.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the published package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" release/*.tgz
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
